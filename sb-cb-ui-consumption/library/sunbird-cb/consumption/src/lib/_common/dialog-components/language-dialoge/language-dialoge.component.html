<ng-container *ngIf="data?.from === 'openLanguageDialog'">
  <div  class="confirmation-dialog-container">  
    <div class="dialog-header text-left flex justify-between align-items-center">
          <!-- <h1 class="mr-2" mat-dialog-title>Available Languages</h1> -->
          <!-- <mat-icon class="mat-icon notranslate material-icons close-icon" matprefix="" role="img" aria-hidden="true" [mat-dialog-close]="false">close</mat-icon> -->
        <!-- <mat-icon class="text-center notranslate material-icons info-icon" matprefix="" role="img" aria-hidden="true" [mat-dialog-close]="false" height="24px" width="24px">info_outline</mat-icon> -->
          <p class="mat-subheading-1">Available Languages</p> <a (click)="dialogRef.close()" class="cursor-pointer"><mat-icon class="close-icon">close</mat-icon></a>
    </div>
    
    <div class="lang-msg-wrapper">
     
      <!-- <p class="domain-message">{{'profileInfo.emailApprovedPopupMsg' | translate}}</p>
      <p class="domain-sub-message">{{'profileInfo.emailApprovedPopupSubmsg' | translate}}</p> -->
      <!-- {{data|json}} -->
      <p *ngFor="let lang of data?.content" class="language-item">
        <span class="language-name">{{ lang.localName }} ({{ lang.name }})</span>

      </p>
    </div> 
</div>
